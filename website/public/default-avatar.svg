<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="tieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="100" cy="100" r="96" fill="url(#bgGrad)" stroke="#3b82f6" stroke-width="4" stroke-opacity="0.4" />

  <!-- Inner Soft Glow -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.2" />

  <!-- Head -->
  <circle cx="100" cy="74" r="34" fill="url(#avatarGrad)" filter="url(#shadow)" />

  <!-- Shoulders & Torso -->
  <path d="M 46 172 C 48 132 70 120 100 120 C 130 120 152 132 154 172 C 140 184 122 192 100 192 C 78 192 60 184 46 172 Z" fill="url(#avatarGrad)" filter="url(#shadow)" />

  <!-- Tie Silhouette -->
  <path d="M 96 122 L 104 122 L 106 136 L 100 158 L 94 136 Z" fill="url(#tieGrad)" />
</svg>
